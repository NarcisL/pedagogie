<style>
/* Layout: same squared-notebook family as the quiz; a reading column with a fixed player docked at the bottom like a car-radio strip. */
:root {
  --paper: #F2F4F8;
  --grid: #DFE5EF;
  --card: #FFFFFF;
  --ink: #18202B;
  --muted: #586374;
  --line: #D2D9E4;
  --pen: #2A43B0;
  --pen-soft: #E4E9FA;
  --mark: #FFF0B8;
  --key-bg: #EAF5EE;
  --key-ink: #1D6A44;
  --warn-soft: #FFF3D6;
  --warn: #8A5A00;
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161E; --grid: #19202B; --card: #18202B; --ink: #E5EAF1; --muted: #9AA5B5;
    --line: #2A3442; --pen: #93A8FF; --pen-soft: #1E2849; --mark: #4A3F12;
    --key-bg: #142C1F; --key-ink: #7FD8A6; --warn-soft: #33290F; --warn: #F2C56B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161E; --grid: #19202B; --card: #18202B; --ink: #E5EAF1; --muted: #9AA5B5;
  --line: #2A3442; --pen: #93A8FF; --pen-soft: #1E2849; --mark: #4A3F12;
  --key-bg: #142C1F; --key-ink: #7FD8A6; --warn-soft: #33290F; --warn: #F2C56B; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.6;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: 28px 190px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.mono { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; }
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 0.92rem; margin: 0; }
.note b { font-weight: 700; }

.toc { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.toc::-webkit-scrollbar { display: none; }
.toc button { flex: 0 0 auto; font-family: var(--f-mono); font-size: 0.85rem; min-width: 44px; min-height: 42px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.toc button.on { background: var(--pen); border-color: var(--pen); color: var(--card); }

section.lesson { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 16px; }
.lhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lhead > div { min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.28rem; line-height: 1.25; margin: 2px 0 0; text-wrap: balance; }
.from { flex: 0 0 auto; font: inherit; font-size: 0.88rem; font-weight: 600; color: var(--pen); background: var(--pen-soft); border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
section.lesson p { margin: 0; max-width: 65ch; }
p.key { background: var(--key-bg); color: var(--key-ink); border-radius: 8px; padding: 10px 12px; font-weight: 600; }
.s { cursor: pointer; border-radius: 3px; transition: background-color .2s; }
.s:hover { background: var(--pen-soft); }
.s.now { background: var(--mark); box-shadow: 0 0 0 2px var(--mark); }
h2.now { background: var(--mark); box-shadow: 0 0 0 3px var(--mark); border-radius: 3px; }

.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 1px solid var(--line);
  box-shadow: 0 -10px 30px -20px rgba(20,30,60,.45);
  padding-top: 10px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pin { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.now-title { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.now-title b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.now-title span:last-child { flex: 0 0 auto; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--pen); }
.ctrls { display: flex; align-items: center; justify-content: center; gap: 10px; }
.cb { font: inherit; font-size: 0.95rem; font-weight: 600; min-width: 52px; min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: inline-grid; place-items: center; padding: 0 12px; }
.cb.play { min-width: 68px; min-height: 68px; background: var(--pen); border-color: var(--pen); color: var(--card); font-size: 1.5rem; }
.cb:disabled { opacity: .4; cursor: not-allowed; }
.opts { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.86rem; color: var(--muted); }
.opts label { display: inline-flex; align-items: center; gap: 6px; }
select { font: inherit; font-size: 0.88rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
input[type="checkbox"] { accent-color: var(--pen); width: 16px; height: 16px; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
@media (max-width: 640px) {
  body { font-size: 16.5px; }
  .wrap { padding-block: 18px 200px; gap: 16px; }
  section.lesson { padding: 16px 14px; }
  .lhead { flex-direction: column; gap: 8px; }
  .from { align-self: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .s { transition: none; } }
</style>

<div class="wrap">
  <header>
    <span class="mono" style="color:var(--pen)">Recapitulare audio · 11 subiecte</span>
    <h1>Psihopedagogie pe drum</h1>
    <p class="sub" id="sub">Toate cele 11 subiecte, scrise pentru ascultare, cu exemple din ora de programare. Apasă ▶ și telefonul ți le citește.</p>

          <option value="1.1">1,1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option>
        </select>
      </label>
      <label for="follow"><input type="checkbox" id="follow" checked> Urmărește textul</label>
    </div>
  </div>
</div>

    "De reținut. Cele două se folosesc complementar. Abordarea disciplinară construiește fundamentul conceptual, iar cea integrată facilitează relaționarea și aplicarea cunoștințelor."

    "Curriculumul elaborat în școală poate lua forma unor activități, module, proiecte sau discipline opționale care nu sunt incluse în programa obligatorie. Are obiective și conținuturi noi și apare ca rubrică distinctă în catalog. La informatică, de exemplu, un opțional de dezvoltare de aplicații mobile.",
    "De ce contează în paradigma modernă? Curriculumul la decizia școlii concretizează șapte lucruri. Descentralizarea și flexibilizarea, pentru că școala își poate adapta oferta. Centrarea pe elev, prin raportarea la interese, aptitudini, nevoi și ritmuri de învățare. Individualizarea parcursurilor, prin aprofundare, extindere și opționale. Legătura cu viața și cu comunitatea, prin probleme locale. Interdisciplinaritatea și transdisciplinaritatea, prin teme și proiecte integrate. Formarea competențelor, prin activități practice și experiențe relevante. Și participarea comunității, pentru că oferta poate fi stabilită împreună cu elevii, părinții și reprezentanții comunității locale.",
    "De reținut. Curriculumul nucleu garantează baza comună și egalitatea șanselor. Curriculumul la decizia școlii asigură flexibilitatea, diferențierea și adaptarea educației la elev și la contextul social."
  ]},
  { title: "Final", intro: true, paras: [
    "Gata, asta a fost toată recapitularea. Când ajungi, fă o rundă din quiz pe subiectele la care nu te-ai simțit sigur."
  ]}
];

// ---------- build text ----------
const flat = []; // { t, si, el }
const secStart = [];
const lessonsEl = document.getElementById("lessons");
const tocEl = document.getElementById("toc");
const lessonsWrap = document.createElement("div");
lessonsWrap.style.cssText = "display:flex;flex-direction:column;gap:16px";
lessonsEl.append(lessonsWrap);

function words(s) { return s.split(/\s+/).length; }
SECTIONS.forEach((sec, si) => {
  secStart[si] = flat.length;
  const box = document.createElement("section");
  box.className = "lesson"; box.id = "s" + si;
  const head = document.createElement("div"); head.className = "lhead";
  const hd = document.createElement("div");
  const eyebrow = document.createElement("span"); eyebrow.className = "mono"; eyebrow.style.color = "var(--muted)";
  const totalWords = sec.paras.reduce((a, p) => a + words(p), 0) + words(sec.title);
  eyebrow.textContent = (sec.n ? `Subiectul ${sec.n} · ` : "") + `~${Math.max(1, Math.round(totalWords / 140))} min`;
  const h2 = document.createElement("h2"); h2.textContent = sec.title;
  hd.append(eyebrow, h2);
  const from = document.createElement("button"); from.className = "from"; from.textContent = "▶ Ascultă de aici";
  from.addEventListener("click", () => playFrom(secStart[si]));
  head.append(hd, from);
  box.append(head);
  if (!sec.intro) flat.push({ t: `Subiectul ${sec.n}. ${sec.title}.`, si, el: h2 });
  sec.paras.forEach(p => {
    const para = document.createElement("p");
    if (p.startsWith("De reținut")) para.className = "key";
    p.split(/(?<=[.!?])\s+/).forEach((t, k) => {
      const sp = document.createElement("span"); sp.className = "s"; sp.textContent = t;
      const i = flat.length; sp.dataset.i = i;
      sp.addEventListener("click", () => playFrom(i));
      flat.push({ t, si, el: sp });
      para.append(sp, " ");
    });
    box.append(para);
  });
  lessonsWrap.append(box);
  if (sec.n) {
    const b = document.createElement("button"); b.textContent = String(sec.n);
    b.setAttribute("aria-label", `Subiectul ${sec.n}: ${sec.title}`);
    b.addEventListener("click", () => { document.getElementById("s" + si).scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "start" }); });
    sec.tocBtn = b; tocEl.append(b);
  }
});
const totalWordsAll = flat.reduce((a, f) => a + words(f.t), 0);
const wordsBefore = []; flat.reduce((a, f, i) => (wordsBefore[i] = a, a + words(f.t)), 0);

// ---------- speech ----------
const synth = window.speechSynthesis;
let voice = null, idx = 0, playing = false, curU = null, rate = 1, wakeLock = null;
const $ = (id) => document.getElementById(id);
function motionOK() { return !matchMedia("(prefers-reduced-motion: reduce)").matches; }

function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  if (!vs.length) return;
  voice = vs.find(v => /^ro(-|_|$)/i.test(v.lang) && v.localService) || vs.find(v => /^ro/i.test(v.lang)) || null;
  const note = $("voiceNote");
  if (!voice) {
    note.hidden = false;
    note.innerHTML = "<b>Nu am găsit o voce în limba română pe acest dispozitiv.</b> Textul va fi citit cu vocea implicită și poate suna ciudat. Pe Android: Setări › Accesibilitate › Ieșire text-în-vorbire, apoi descarcă limba română. Pe iPhone: Setări › Accesibilitate › Conținut vorbit › Voci › Română.";
  } else note.hidden = true;
}
if (synth) { pickVoice(); synth.addEventListener?.("voiceschanged", pickVoice); }
else {
  const note = $("voiceNote"); note.hidden = false;
  note.innerHTML = "<b>Acest browser nu poate citi textul cu voce tare.</b> Deschide pagina în Chrome sau Safari, sau folosește funcția telefonului de citire a ecranului.";
  ["play", "back", "fwd", "prevSec", "nextSec"].forEach(id => $(id).disabled = true);
}

function speakCur() {
  if (!playing) return;
  if (idx >= flat.length) { stop(); idx = 0; highlight(); return; }
  const u = new SpeechSynthesisUtterance(flat[idx].t);
  u.lang = "ro-RO"; if (voice) u.voice = voice; u.rate = rate;
  u.onend = () => { if (u !== curU || !playing) return; idx++; save(); highlight(); speakCur(); };
  u.onerror = (e) => { if (u !== curU || !playing) return; if (e.error === "interrupted" || e.error === "canceled") return; idx++; speakCur(); };
  curU = u;
  synth.speak(u);
  highlight();
}
function playFrom(i) {
  if (!synth) return;
  idx = Math.max(0, Math.min(i, flat.length - 1));
  curU = null; synth.cancel();
  playing = true; setPlayBtn(); grabWake();
  setTimeout(speakCur, 80);
}
function stop() { playing = false; curU = null; if (synth) synth.cancel(); setPlayBtn(); releaseWake(); save(); }
function setPlayBtn() { const b = $("play"); b.textContent = playing ? "❚❚" : "▶"; b.setAttribute("aria-label", playing ? "Pauză" : "Pornește"); }

async function grabWake() { try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch (e) { wakeLock = null; } }
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && playing) grabWake(); });

let lastEl = null;
function highlight() {
  const f = flat[Math.min(idx, flat.length - 1)];
  if (lastEl) lastEl.classList.remove("now");
  if (f) {
    f.el.classList.add("now"); lastEl = f.el;
    if (playing && $("follow").checked) f.el.scrollIntoView({ behavior: motionOK() ? "smooth" : "auto", block: "center" });
    const sec = SECTIONS[f.si];
    $("nowTitle").textContent = sec.n ? `${sec.n}. ${sec.title}` : sec.title;
    const left = Math.max(0, Math.round((totalWordsAll - wordsBefore[idx]) / (140 * rate)));
    $("nowTime").textContent = `~${left} min rămase`;
    $("barFill").style.width = `${(wordsBefore[idx] / totalWordsAll) * 100}%`;
    SECTIONS.forEach((s, k) => s.tocBtn && s.tocBtn.classList.toggle("on", k === f.si));
  }
}
function save() { try { localStorage.setItem("ppd-idx", String(idx)); localStorage.setItem("ppd-rate", String(rate)); } catch (e) {} }

$("play").addEventListener("click", () => playing ? stop() : playFrom(idx));
$("back").addEventListener("click", () => { const i = Math.max(0, idx - 1); playing ? playFrom(i) : (idx = i, highlight(), save()); });
$("fwd").addEventListener("click", () => { const i = Math.min(flat.length - 1, idx + 1); playing ? playFrom(i) : (idx = i, highlight(), save()); });
function curSec() { return flat[Math.min(idx, flat.length - 1)].si; }
$("prevSec").addEventListener("click", () => {
  let si = curSec();
  if (idx - secStart[si] < 3 && si > 0) si--; // near the start: jump to the previous lesson
  playing ? playFrom(secStart[si]) : (idx = secStart[si], highlight(), save());
});
$("nextSec").addEventListener("click", () => {
  const si = Math.min(SECTIONS.length - 1, curSec() + 1);
  playing ? playFrom(secStart[si]) : (idx = secStart[si], highlight(), save());
});
$("rate").addEventListener("change", (e) => { rate = parseFloat(e.target.value); save(); if (playing) playFrom(idx); else highlight(); });

try {
  const r = parseFloat(localStorage.getItem("ppd-rate")); if (r) { rate = r; $("rate").value = String(r); }
  const i = parseInt(localStorage.getItem("ppd-idx"), 10); if (i >= 0 && i < flat.length) idx = i;
} catch (e) {}
$("sub").textContent = `Toate cele 11 subiecte, scrise pentru ascultare, cu exemple din ora de programare. Cam ${Math.round(totalWordsAll / 140)} de minute la viteză normală. Apasă ▶ și telefonul ți le citește. Atinge orice propoziție ca să sari la ea.`;
highlight();
</script>
