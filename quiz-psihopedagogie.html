<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow study column on squared school-notebook paper; blue-pen ink for actions, teacher's red pen for mistakes. */
:root {
  --paper: #F2F4F8;
  --grid: #DFE5EF;
  --card: #FFFFFF;
  --ink: #18202B;
  --muted: #586374;
  --line: #D2D9E4;
  --pen: #2A43B0;
  --pen-soft: #E4E9FA;
  --ok: #1D7549;
  --ok-soft: #DDF1E5;
  --bad: #BE342D;
  --bad-soft: #FBE4E2;
  --warn-soft: #FFF3D6;
  --warn: #8A5A00;
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161E; --grid: #19202B; --card: #18202B; --ink: #E5EAF1; --muted: #9AA5B5;
    --line: #2A3442; --pen: #93A8FF; --pen-soft: #1E2849; --ok: #63CE93; --ok-soft: #142C1F;
    --bad: #FF8F86; --bad-soft: #391B19; --warn-soft: #33290F; --warn: #F2C56B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161E; --grid: #19202B; --card: #18202B; --ink: #E5EAF1; --muted: #9AA5B5;
  --line: #2A3442; --pen: #93A8FF; --pen-soft: #1E2849; --ok: #63CE93; --ok-soft: #142C1F;
  --bad: #FF8F86; --bad-soft: #391B19; --warn-soft: #33290F; --warn: #F2C56B; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; flex-direction: column; gap: 6px; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.7rem, 4.5vw, 2.3rem); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
.mono { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.filters-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--f-mono); font-size: 0.85rem; min-width: 40px; padding: 6px 10px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--card); }
.chip:hover { border-color: var(--pen); }
.topic-hint { color: var(--muted); font-size: 0.88rem; min-height: 1.3em; margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; cursor: pointer; }
.toggle input { accent-color: var(--pen); width: 16px; height: 16px; }

.status { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 0.92rem; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pen); width: 0; transition: width .25s ease; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20,30,60,.35); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
.pill { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--pen-soft); color: var(--pen); }
.pill.trap { background: var(--warn-soft); color: var(--warn); }
.qtext { font-family: var(--f-display); font-weight: 500; font-size: 1.22rem; line-height: 1.4; margin: 0; text-wrap: pretty; }
.instr { color: var(--muted); font-size: 0.92rem; margin: -6px 0 0; }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  text-align: left; font: inherit; color: var(--ink); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 14px; cursor: pointer;
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start;
}
.opt .k { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); padding-top: 2px; }
.opt:hover:not(:disabled) { border-color: var(--pen); }
.opt[aria-pressed="true"] { border-color: var(--pen); background: var(--pen-soft); }
.opt:disabled { cursor: default; }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-missed { border-color: var(--ok); border-style: dashed; }

.rows { display: flex; flex-direction: column; gap: 10px; }
.row { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.row.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.row.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.row p { margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: inherit; font-size: 0.88rem; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--pen); color: var(--card); border-color: var(--pen); }
.seg button:disabled { cursor: default; }
.seg button.right { outline: 2px solid var(--ok); outline-offset: 1px; }
.rowfix { font-size: 0.86rem; color: var(--bad); }

textarea { width: 100%; min-height: 110px; font: inherit; font-size: 1rem; color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical; }
textarea:focus { border-color: var(--pen); outline: none; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 1.5px solid var(--pen); background: var(--pen); color: var(--card); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--pen); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.okb { background: var(--ok); border-color: var(--ok); }
.btn.badb { background: var(--bad); border-color: var(--bad); }
.btn.midb { background: transparent; color: var(--warn); border-color: var(--warn); }
.hint { color: var(--muted); font-size: 0.85rem; }

.fb { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--paper); }
.fb h3 { margin: 0; font-family: var(--f-display); font-size: 1.1rem; }
.fb.ok h3 { color: var(--ok); }
.fb.bad h3 { color: var(--bad); }
.fb p { margin: 0; }
.fb .lbl { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.fb .idea { border-top: 1px dashed var(--line); padding-top: 8px; }
.model { background: var(--pen-soft); border-radius: 8px; padding: 12px 14px; }
.model p { margin: 0; }

.end h2 { font-family: var(--f-display); font-size: 1.5rem; margin: 0; }
.grade { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.grade .n { font-family: var(--f-display); font-weight: 800; font-size: 3.4rem; line-height: 1; color: var(--pen); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.93rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
td.num { text-align: right; white-space: nowrap; }
.mini { width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.mini > i { display: block; height: 100%; background: var(--ok); }
.misslist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.92rem; }
.misslist b { color: var(--ink); font-weight: 600; }

button:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
.statusbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 8px; margin-block: -8px; display: flex; flex-direction: column; gap: 6px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
@media (hover: none) { .kbd { display: none; } }

/* Phones: bigger tap targets, one-line scrollable subject chips, full-width actions. */
@media (max-width: 640px) {
  body { font-size: 16px; }
  .wrap { padding-block: 16px 40px; gap: 14px; }
  .sub { font-size: 0.9rem; }
  .panel { padding: 12px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin-inline: -12px; padding-inline: 12px; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 42px; min-width: 44px; }
  .topic-hint { font-size: 0.82rem; }
  .card { padding: 18px 14px; gap: 14px; border-radius: 10px; }
  .qtext { font-size: 1.08rem; }
  .opt { padding: 13px 12px; min-height: 52px; grid-template-columns: 22px 1fr; }
  .seg button { flex: 1 1 auto; min-height: 44px; padding: 8px 10px; }
  .row { padding: 10px; }
  .actions .btn { flex: 1 1 100%; min-height: 48px; }
  .actions .hint { flex: 1 1 100%; }
  .grade .n { font-size: 2.8rem; }
  .mini { width: 56px; }
  th, td { padding: 7px 4px; }
}
</style>

<div class="wrap">
  <header>
    <span class="mono" style="color:var(--pen)">Examen · Psihopedagogie</span>
    <h1>Quiz Psihopedagogie</h1>
    <p class="sub">Itemi pe toate cele 11 subiecte, cu exemple din ora de programare. Feedback-ul explică în engleză de ce un răspuns e corect.</p>
  </header>

  <section class="panel" aria-label="Filtru pe subiecte">
    <div class="filters-head">
      <span class="mono" style="color:var(--muted)">Subiectele de examen</span>
      <label class="toggle" for="shuffle"><input type="checkbox" id="shuffle"> Ordine aleatorie</label>
    </div>
    <div class="chips" id="chips"></div>
    <p class="topic-hint" id="topicHint">Toate subiectele. Alege unul sau mai multe numere pentru a te concentra doar pe ele.</p>
  </section>

  <div class="statusbar">
    <div class="status"><span id="posTxt"></span><span id="scoreTxt"></span></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </div>

  <main id="stage"></main>
</div>

<script>
const TOPICS = {
  1: "Direcțiile de dezvoltare a pedagogiei contemporane",
  2: "Practici educaționale clasice și moderne",
  3: "Perspective asupra fenomenului educațional",
  4: "Dimensiunea socială și individuală a scopului educației",
  5: "Funcțiile educației ca fenomen social",
  6: "Educația formală, nonformală și informală",
  7: "Obiective operaționale după Mager",
  8: "Nivelurile integrării curriculare: exemple",
  9: "Avantajele și dezavantajele nivelurilor integrării",
  10: "Abordarea disciplinară și abordarea integrată",
  11: "Curriculum nucleu și curriculum la decizia școlii"
};

const DIRECTIONS = [
  "Reconsiderarea rolului elevului",
  "Centrarea pe procesul învățării și pe competențe",
  "Învățarea prin rezolvarea de probleme și stimularea gândirii critice",
  "Valorificarea experiențelor interactive",
  "Utilizarea tehnologiilor informatizate",
  "Personalizarea și individualizarea instruirii",
  "Reconstrucția spațiului școlar",
  "Educația permanentă și orientarea spre viitor"
];
const FNI = ["Educație formală", "Educație nonformală", "Educație informală"];
const LEVELS = ["Intradisciplinaritate", "Multidisciplinaritate", "Interdisciplinaritate", "Transdisciplinaritate"];
const CDS_FORMS = ["Curriculum nucleu aprofundat", "Curriculum extins", "Curriculum elaborat în școală", "Curriculum nucleu (trunchi comun)"];

// type: mc | tf | multi | sort | open.  trap: tests a common mistake.
const ITEMS = [
  // ───────── 1 ─────────
  { q: 1, type: "mc", kind: "Scenariu", trap: true,
    text: "La ora de programare, fiecare elev alege ce aplicație construiește (un joc, o listă de sarcini sau un quiz), primește fișe de dificultăți diferite și este evaluat după cât a progresat față de propriul punct de plecare. Ce direcție a pedagogiei contemporane ilustrează situația?",
    opts: [DIRECTIONS[5], DIRECTIONS[4], DIRECTIONS[6], DIRECTIONS[2]], ans: 0,
    why: "Differentiated tasks, choice of project topic and judging progress against the student's own potential are exactly the operational solutions listed for personalisation and individualisation.",
    idea: "Personalizarea respectă ritmurile, stilurile și particularitățile fiecărui elev și evaluează progresul raportat la propriul potențial." },
  { q: 1, type: "tf", kind: "Adevărat / Fals", trap: true,
    text: "Personalizarea instruirii înseamnă că profesorul îi aduce pe toți elevii la același nivel de performanță, în același ritm.",
    ans: 1,
    why: "False. Personalisation is not about making everyone identical. Each student's progress is measured relative to their OWN potential, respecting their pace and learning style. 'Same pace for everyone' is actually a feature of the classic paradigm (Q2).",
    idea: "Personalizare = evaluarea progresului fiecărui elev în raport cu propriul potențial, nu uniformizare." },
  { q: 1, type: "mc", kind: "Greșeală frecventă", trap: true,
    text: "Care activitate ilustrează cel mai bine direcția „valorificarea experiențelor interactive”?",
    opts: [
      "Un concurs individual de rezolvare rapidă a problemelor, cu clasament afișat pe tablă",
      "Pair programming (un elev scrie codul, celălalt îl ghidează), urmat de code review între echipe și discutarea soluțiilor alternative",
      "Profesorul prezintă soluția corectă, iar elevii o copiază în caiet",
      "Fiecare elev rezolvă singur aceeași fișă de exerciții"
    ], ans: 1,
    why: "Interactive learning means cooperation, confronting opinions and peer learning. Pair programming and code reviews are the programming-class version of teamwork, cooperative learning and learning between colleagues. A ranking contest is competitive and individual, so it misses the point.",
    idea: "Învățarea interactivă se bazează pe cooperare și învățare între colegi, nu pe competiție." },
  { q: 1, type: "mc", kind: "Scenariu",
    text: "Profesorul le dă elevilor un program care afișează rezultate greșite. Elevii trebuie să găsească cauza erorii, să compare două variante de corectare și să argumenteze care e mai bună. Ce direcție ilustrează?",
    opts: [DIRECTIONS[0], DIRECTIONS[2], DIRECTIONS[7], DIRECTIONS[6]], ans: 1,
    why: "Debugging is problem solving: students analyse a situation, identify causes and effects, compare solutions and draw argued conclusions. It is the programming equivalent of analysing a local pollution source and proposing interventions.",
    idea: "Elevii analizează situații, compară soluții și formulează concluzii argumentate: gândire critică prin rezolvare de probleme." },
  { q: 1, type: "mc", kind: "Scenariu",
    text: "Elevii învață să citească documentația oficială a unui limbaj de programare și să-și actualizeze singuri cunoștințele când apare o versiune nouă. Ce direcție este concretizată?",
    opts: [DIRECTIONS[4], DIRECTIONS[1], DIRECTIONS[7], DIRECTIONS[3]], ans: 2,
    why: "Learning to document yourself and update your skills independently is the solution listed for lifelong education: education does not end with school. Using technology is present, but the goal here is autonomy in learning over time.",
    idea: "Educația permanentă formează autonomia în învățare, capacitatea de documentare și disponibilitatea de actualizare a competențelor." },
  { q: 1, type: "mc", kind: "Scenariu",
    text: "În laboratorul de informatică, mesele sunt mutate în „insule” pentru echipe, există un colț pentru lucrul în perechi, iar clasa vizitează o firmă IT din oraș. Ce direcție este vizată?",
    opts: [DIRECTIONS[6], DIRECTIONS[5], DIRECTIONS[4], DIRECTIONS[0]], ans: 0,
    why: "Flexible room layout, group work, labs, field trips and using the local community as a learning environment are the solutions for rebuilding the school space so it favours interaction and cooperation.",
    idea: "Spațiul de învățare trebuie să favorizeze interacțiunea, cooperarea și ascultarea activă." },

  // ───────── 2 ─────────
  { q: 2, type: "sort", kind: "Clasic sau modern?",
    text: "Sortează fiecare practică: aparține paradigmei clasice sau celei moderne?",
    cats: ["Clasică", "Modernă"],
    rows: [
      ["Profesorul dictează sintaxa buclei for, iar elevii o reproduc identic la test.", 0],
      ["Elevii pornesc de la o problemă reală (o aplicație pentru biblioteca școlii) și o construiesc în echipe.", 1],
      ["Toți elevii parcurg aceleași exerciții, în același ritm.", 0],
      ["Profesorul organizează sarcinile, circulă printre echipe și oferă feedback.", 1],
      ["Comunicarea merge într-un singur sens: profesorul vorbește, elevii ascultă.", 0],
      ["Evaluarea urmărește progresul, aplicarea și autoreglarea (elevii își verifică singuri codul cu teste).", 1],
      ["Elevii sunt etichetați „buni” sau „slabi” la programare după norme exterioare.", 0],
      ["Lecția despre poluarea apei pornește de la un caz real, iar elevii analizează date și propun soluții.", 1]
    ],
    why: "Classic practice centres on the teacher and the subject: one-way communication, same pace, reproduction, external labels. Modern practice centres on the student and the learning process: real problems, teamwork, the teacher as facilitator, progress-based evaluation and self-regulation.",
    idea: "Clasic: profesorul și materia în centru, învățarea ca produs. Modern: elevul și procesul învățării în centru." },
  { q: 2, type: "tf", kind: "Adevărat / Fals", trap: true,
    text: "Într-o lecție modernă despre algoritmii de sortare, profesorul nu ar trebui să mai explice nimic, deoarece explicația aparține paradigmei clasice.",
    ans: 1,
    why: "False. The two paradigms are complementary, not absolute opposites. The teacher's explanation is still useful for structuring knowledge (e.g. explaining how bubble sort works), but it should be completed by interactive methods and practice (e.g. students sort cards by hand, then implement and compare algorithms).",
    idea: "Cele două paradigme nu trebuie opuse absolut: explicația rămâne utilă, dar e completată de metode interactive." },
  { q: 2, type: "mc", kind: "Definiție",
    text: "Cum este privită învățarea în paradigma clasică, respectiv în cea modernă?",
    opts: ["Clasic: ca proces · Modern: ca produs", "Clasic: ca produs · Modern: ca proces", "În ambele: ca produs", "În ambele: ca proces"], ans: 1,
    why: "The classic paradigm cares about the final result (what you can reproduce). The modern one cares about how learning happens, which is why it values feedback, progress and self-regulation along the way.",
    idea: "Trecerea de la învățarea-produs la învățarea-proces este una dintre schimbările-cheie ale paradigmei moderne." },
  { q: 2, type: "mc", kind: "Definiție",
    text: "Care este finalitatea educației în paradigma clasică?",
    opts: [
      "Dezvoltarea personală, formarea competențelor și pregătirea pentru viitor",
      "Formarea unui minim de aptitudini necesare prezentului",
      "Valorizarea persoanei și raportarea la potențialul propriu",
      "Adaptarea la ritmurile și particularitățile elevilor"
    ], ans: 1,
    why: "The classic aim is a minimum of skills needed for the present. The modern aim is broader: personal development, competences and readiness for the future. The other options are modern traits from other rows of the table.",
    idea: "Clasic: minimum pentru prezent. Modern: dezvoltare personală și pregătire pentru viitor." },
  { q: 2, type: "mc", kind: "Definiție",
    text: "Care set de metode este caracteristic paradigmei moderne?",
    opts: [
      "Expunere, explicație, exercițiu repetitiv",
      "Proiect, problematizare, experiment, studiu de caz, dezbatere",
      "Dictare, memorare, reproducere",
      "Activitate exclusiv frontală, structură rigidă"
    ], ans: 1,
    why: "Projects, problem-based learning, experiments, case studies and debates put the student in an active role. In a programming class: building a project, debugging challenges, comparing two algorithms experimentally.",
    idea: "Metodele moderne îl fac pe elev să cerceteze, să coopereze, să descopere și să rezolve probleme." },
  { q: 2, type: "open", kind: "Explică de ce",
    text: "Explică de ce, într-o lecție despre sortarea tablourilor, explicația profesorului și activitatea practică a elevilor nu se exclud.",

// ---------- state ----------
const S = { filter: new Set(), shuffle: false, mode: "all", queue: [], pos: 0, results: {}, cur: null };

const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}
function shuffled(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
const fmt = (n) => n.toFixed(2).replace(".", ",");
const LETTERS = "ABCDEFGH";

function poolForFilter() {
  return ITEMS.map((_, i) => i).filter(i => S.filter.size === 0 || S.filter.has(ITEMS[i].q));
}
function startSession(mode, list) {
  S.mode = mode;
  let q = list || poolForFilter();
  if (S.shuffle) q = shuffled(q);
  S.queue = q; S.pos = 0; S.results = {}; S.cur = null;
  render();
}

// ---------- filter UI ----------
function renderChips() {
  const box = $("chips"); box.textContent = "";
  box.append(h("button", { class: "chip", "aria-pressed": String(S.filter.size === 0), onclick: () => { S.filter.clear(); afterFilter(); } }, "Toate"));
  for (let n = 1; n <= 11; n++) {
    const count = ITEMS.filter(it => it.q === n).length;
    box.append(h("button", {
      class: "chip", title: `${TOPICS[n]} (${count} itemi)`, "aria-pressed": String(S.filter.has(n)),
      "aria-label": `Subiectul ${n}: ${TOPICS[n]}`,
      onclick: () => { S.filter.has(n) ? S.filter.delete(n) : S.filter.add(n); afterFilter(); }
    }, String(n)));
  }
  const hint = $("topicHint");
  if (S.filter.size === 0) hint.textContent = `Toate cele 11 subiecte (${ITEMS.length} itemi). Alege unul sau mai multe numere pentru a te concentra doar pe ele.`;
  else hint.textContent = [...S.filter].sort((a, b) => a - b).map(n => `${n}. ${TOPICS[n]}`).join(" · ");
}
function afterFilter() { try { localStorage.setItem("pp-filter", JSON.stringify([...S.filter])); } catch (e) {} renderChips(); startSession("all"); }

// ---------- status ----------
function renderStatus() {
  const total = S.queue.length, done = Object.keys(S.results).length;
  const ok = Object.values(S.results).filter(Boolean).length;
  const label = S.mode === "review" ? "Recapitulare greșeli · " : "";
  $("posTxt").innerHTML = "";
  $("posTxt").append(label, "Itemul ", h("b", null, String(Math.min(S.pos + 1, total))), ` din ${total}`);
  $("scoreTxt").innerHTML = "";
  $("scoreTxt").append("Corecte: ", h("b", null, String(ok)), ` din ${done} răspunse`);
  $("barFill").style.width = total ? `${(done / total) * 100}%` : "0";
}

// ---------- item rendering ----------
function render() {
  renderStatus();
  const stage = $("stage"); stage.textContent = "";
  if (S.pos >= S.queue.length) { stage.append(renderEnd()); return; }
  const idx = S.queue[S.pos], it = ITEMS[idx];
  if (!S.cur || S.cur.idx !== idx) S.cur = { idx, answered: false, pick: null, order: null, sel: new Set(), rowPick: {} };
  const card = h("article", { class: "card", "aria-live": "polite" });
  card.append(
    h("div", { class: "meta" },
      h("span", { class: "mono" }, `Subiectul ${it.q} · ${TOPICS[it.q]}`)),
    h("div", { class: "meta" },
      h("span", { class: "pill" }, it.kind),
      it.trap ? h("span", { class: "pill trap" }, "Capcană frecventă") : null),
    h("p", { class: "qtext" }, it.text)
  );
  const body = h("div", { class: "opts" });
  card.append(body);
  const fbSlot = h("div");
  ({ mc: renderMC, tf: renderMC, multi: renderMulti, sort: renderSort, open: renderOpen })[it.type](it, body, card, fbSlot);
  card.append(fbSlot);
  stage.append(card);
}

function grade(correct) {
  S.cur.answered = true;
  S.results[S.cur.idx] = correct;
  renderStatus();
}

function feedback(slot, it, correct, opts = {}) {
  slot.textContent = "";
  const isLast = S.pos + 1 >= S.queue.length;
  const box = h("div", { class: "fb " + (correct ? "ok" : "bad") },
    h("h3", null, opts.title || (correct ? "✓ Corect" : "✗ Greșit")),
    opts.correctText ? h("p", null, h("span", { class: "lbl" }, "Răspunsul corect"), opts.correctText) : null,
    h("p", null, h("span", { class: "lbl" }, "Why"), it.why),
    h("p", { class: "idea" }, h("span", { class: "lbl" }, "Ideea de bază"), it.idea)
  );
  const next = h("button", { class: "btn", id: "nextBtn", onclick: () => { S.pos++; S.cur = null; render(); window.scrollTo({ top: 0, behavior: "smooth" }); } }, isLast ? "Vezi rezultatul" : "Următorul item →");
  slot.append(box, h("div", { class: "actions", style: "margin-top:14px" }, next, h("span", { class: "hint kbd" }, "sau apasă Enter")));
  next.focus({ preventScroll: true });
  // On a phone the feedback lands below the fold; bring it into view.
  if (matchMedia("(max-width: 640px)").matches) {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    box.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
  }
}

function renderMC(it, body, card, fb) {
  const opts = it.type === "tf" ? ["Adevărat", "Fals"] : it.opts;
  if (!S.cur.order) S.cur.order = it.type === "tf" ? opts.map((_, i) => i) : shuffled(opts.map((_, i) => i));
  const btns = [];
  S.cur.order.forEach((oi, pos) => {
    const b = h("button", { class: "opt", "data-oi": oi, onclick: () => choose(oi) },
      h("span", { class: "k" }, LETTERS[pos]), h("span", null, opts[oi]));
    btns.push(b); body.append(b);
  });
  card.append(h("p", { class: "hint kbd", style: "margin:0" }, `Tastele 1–${opts.length} aleg o variantă.`));
  function choose(oi) {
    if (S.cur.answered) return;
    const ok = oi === it.ans;
    btns.forEach(b => {
      const v = +b.dataset.oi; b.disabled = true;
      if (v === it.ans) b.classList.add("is-ok");
      else if (v === oi) b.classList.add("is-bad");
    });
    grade(ok);
    feedback(fb, it, ok, { correctText: ok ? null : opts[it.ans] });
  }
  S.cur.choose = (pos) => { const oi = S.cur.order[pos]; if (oi != null) choose(oi); };
}

function renderMulti(it, body, card, fb) {
  if (!S.cur.order) S.cur.order = shuffled(it.opts.map((_, i) => i));
  const btns = [];
  S.cur.order.forEach((oi, pos) => {
    const b = h("button", { class: "opt", "aria-pressed": "false", "data-oi": oi, onclick: () => {
      if (S.cur.answered) return;
      S.cur.sel.has(oi) ? S.cur.sel.delete(oi) : S.cur.sel.add(oi);
      b.setAttribute("aria-pressed", String(S.cur.sel.has(oi)));
      b.querySelector(".k").textContent = S.cur.sel.has(oi) ? "☑" : "☐";
    } }, h("span", { class: "k" }, "☐"), h("span", null, it.opts[oi]));
    btns.push(b); body.append(b);
  });
  const check = h("button", { class: "btn", onclick: () => {
    const want = new Set(it.ans);
    let ok = want.size === S.cur.sel.size && [...want].every(x => S.cur.sel.has(x));
    btns.forEach(b => {
      const v = +b.dataset.oi; b.disabled = true;
      const picked = S.cur.sel.has(v), should = want.has(v);
      if (picked && should) b.classList.add("is-ok");
      else if (picked && !should) b.classList.add("is-bad");
      else if (!picked && should) b.classList.add("is-missed");
    });
    check.disabled = true;
    grade(ok);
    feedback(fb, it, ok, { correctText: ok ? null : "Variantele marcate cu verde (cele cu chenar punctat sunt cele pe care nu le-ai bifat)." });
  } }, "Verifică");
  card.append(h("div", { class: "actions" }, check, h("span", { class: "hint" }, "Bifează toate variantele care se potrivesc.")));
}

function renderSort(it, body, card, fb) {
  body.className = "rows";
  const rowEls = [];
  it.rows.forEach(([txt, ans], ri) => {
    const seg = h("div", { class: "seg", role: "group", "aria-label": "Alege categoria" });
    const row = h("div", { class: "row" }, h("p", null, txt), seg);
    it.cats.forEach((c, ci) => {
      seg.append(h("button", { "aria-pressed": "false", "data-ci": ci, onclick: (e) => {
        if (S.cur.answered) return;
        S.cur.rowPick[ri] = ci;
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.ci === ci)));
        check.disabled = Object.keys(S.cur.rowPick).length < it.rows.length;
      } }, c));
    });
    rowEls.push({ row, seg, ans }); body.append(row);
  });
  const check = h("button", { class: "btn", disabled: true, onclick: () => {
    let right = 0;
    rowEls.forEach(({ row, seg, ans }, ri) => {
      const ok = S.cur.rowPick[ri] === ans; if (ok) right++;
      row.classList.add(ok ? "is-ok" : "is-bad");
      seg.querySelectorAll("button").forEach(x => { x.disabled = true; if (+x.dataset.ci === ans) x.classList.add("right"); });
      if (!ok) row.append(h("span", { class: "rowfix" }, "Corect: " + it.cats[ans]));
    });
    check.disabled = true;
    const ok = right === it.rows.length;
    grade(ok);
    feedback(fb, it, ok, { title: ok ? `✓ Toate corecte (${right}/${it.rows.length})` : `✗ ${right} din ${it.rows.length} corecte` });
  } }, "Verifică");
  card.append(h("div", { class: "actions" }, check, h("span", { class: "hint" }, "Alege o categorie pentru fiecare rând.")));
}

function renderOpen(it, body, card, fb) {
  const ta = h("textarea", { id: "open-" + S.cur.idx, placeholder: "Scrie-ți răspunsul aici, în câteva propoziții…", "aria-label": "Răspunsul tău" });
  body.append(ta);
  const reveal = h("button", { class: "btn", onclick: () => {
    reveal.disabled = true; ta.readOnly = true;
    const model = h("div", { class: "model" }, h("p", null, h("span", { class: "mono", style: "color:var(--pen);display:block;margin-bottom:4px" }, "Răspuns model")));
    it.model.split("\n").forEach(p => model.append(h("p", { style: "margin-top:6px" }, p)));
    const selfG = h("div", { class: "actions" },
      h("span", { class: "hint", style: "width:100%" }, "Compară cu răspunsul tău. Cât de bine ai știut?"),
      h("button", { class: "btn okb", onclick: () => done(true, "✓ Am știut") }, "Am știut"),
      h("button", { class: "btn midb", onclick: () => done(false, "◐ Parțial: intră la recapitulare") }, "Parțial"),
      h("button", { class: "btn badb", onclick: () => done(false, "✗ Nu am știut: intră la recapitulare") }, "Nu am știut"));
    actions.replaceWith(h("div", { style: "display:flex;flex-direction:column;gap:12px" }, model, selfG));
    function done(ok, title) { selfG.querySelectorAll("button").forEach(b => b.disabled = true); grade(ok); feedback(fb, it, ok, { title }); }
  } }, "Arată răspunsul model");
  const actions = h("div", { class: "actions" }, reveal, h("span", { class: "hint" }, "Încearcă întâi singur, apoi compară."));
  card.append(actions);
}

// ---------- end screen ----------
function renderEnd() {
  const ids = S.queue, total = ids.length;
  const ok = ids.filter(i => S.results[i]).length;
  const wrong = ids.filter(i => S.results[i] === false);
  const nota = total ? (ok / total) * 10 : 0;
  const card = h("article", { class: "card end" });
  card.append(
    h("span", { class: "mono", style: "color:var(--muted)" }, S.mode === "review" ? "Runda de recapitulare încheiată" : "Sesiune încheiată"),
    h("div", { class: "grade" }, h("span", { class: "n" }, fmt(nota)), h("span", null, h("b", null, `${ok} din ${total}`), " itemi corecți · echivalent notă pe scara 1–10"))
  );
  const byQ = {};
  ids.forEach(i => { const q = ITEMS[i].q; byQ[q] = byQ[q] || { t: 0, ok: 0 }; byQ[q].t++; if (S.results[i]) byQ[q].ok++; });
  const tb = h("tbody");
  Object.keys(byQ).map(Number).sort((a, b) => a - b).forEach(q => {
    const r = byQ[q], pct = r.ok / r.t * 100;
    tb.append(h("tr", null,
      h("td", null, h("b", null, `${q}. `), TOPICS[q]),
      h("td", { class: "num" }, `${r.ok}/${r.t}`),
      h("td", null, h("div", { class: "mini", "aria-hidden": "true" }, h("i", { style: `width:${pct}%` })))));
  });
  card.append(h("h2", null, "Pe subiecte"), h("div", { class: "tablewrap" }, h("table", null, h("thead", null, h("tr", null, h("th", null, "Subiect"), h("th", { class: "num" }, "Corecte"), h("th", null, ""))), tb)));
  if (wrong.length) {
    card.append(h("h2", null, "De recapitulat"),
      h("ol", { class: "misslist" }, wrong.map(i => h("li", null, h("b", null, `Subiectul ${ITEMS[i].q}: `), ITEMS[i].text.length > 140 ? ITEMS[i].text.slice(0, 140) + "…" : ITEMS[i].text))));
  } else {
    card.append(h("p", { style: "margin:0" }, "Nicio greșeală în această rundă. Încearcă „Ordine aleatorie” sau alt subiect."));
  }
  card.append(h("div", { class: "actions" },
    wrong.length ? h("button", { class: "btn", onclick: () => startSession("review", wrong) }, `Revizuiește greșelile (${wrong.length})`) : null,
    h("button", { class: "btn ghost", onclick: () => startSession("all") }, S.filter.size ? "Reia subiectele selectate" : "Reia tot quizul")));
  return card;
}

// ---------- keyboard ----------
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "Enter" && S.cur && S.cur.answered) { const n = $("nextBtn"); if (n && document.activeElement !== n) { e.preventDefault(); n.click(); } return; }
  const it = S.cur && ITEMS[S.cur.idx];
  if (it && (it.type === "mc" || it.type === "tf") && !S.cur.answered && /^[1-8]$/.test(e.key)) S.cur.choose(+e.key - 1);
});

$("shuffle").addEventListener("change", (e) => { S.shuffle = e.target.checked; try { localStorage.setItem("pp-shuffle", S.shuffle ? "1" : "0"); } catch (er) {} startSession(S.mode === "review" ? "all" : "all"); });

function boot() {
  try { const f = JSON.parse(localStorage.getItem("pp-filter") || "[]"); f.forEach(n => S.filter.add(n)); } catch (e) {}
  try { S.shuffle = localStorage.getItem("pp-shuffle") === "1"; } catch (e) {}
  $("shuffle").checked = S.shuffle;
  renderChips();
  startSession("all");
}
boot();
</script>
